services:
  app:
    build:
      context: .
      target: app
    image: quiniela-app:latest
    container_name: quiniela-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-quiniela_app}"
      DB_USERNAME: "${DB_APP_USERNAME:-quiniela}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - quiniela-storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - quiniela

  nginx:
    build:
      context: .
      target: nginx
    image: quiniela-nginx:latest
    container_name: quiniela-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - quiniela-storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - quiniela

  mariadb:
    image: mariadb:11
    container_name: quiniela-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-quiniela_app}"
      MARIADB_USER: "${DB_APP_USERNAME:-quiniela}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret_change_me}"
    volumes:
      - quiniela-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - quiniela

volumes:
  quiniela-mariadb-data:
    driver: local
  quiniela-storage:
    driver: local

networks:
  quiniela:
    driver: bridge
