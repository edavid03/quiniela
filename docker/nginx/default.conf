server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        # Resolver el upstream en runtime via el DNS interno de Docker (127.0.0.11)
        # en lugar de cachear la IP al arrancar: asi, si se recrea el contenedor
        # 'app' con otra IP (cada redeploy), nginx re-resuelve solo y no tira 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
